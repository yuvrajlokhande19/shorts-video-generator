<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReelSplitter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#0d0d17; --bg-sub:#14141f; --surface:#1a1a24; --text:#e8e8f0; --muted:#6b6b80; --accent:#c4b5fd; --border:#2a2a3a; }
    * { box-sizing: border-box; margin:0; padding:0; }
    body { font-family:"Poppins",system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
    .topbar { padding:10px 16px; background:var(--surface); border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
    .logo { width:24px; height:24px; }
    .title { font-weight:600; font-size:14px; color:var(--text); }
    .mode { display:flex; gap:4px; }
    .mode-btn { padding:6px 10px; background:transparent; border:1px solid var(--border); color:var(--muted); font-size:11px; font-weight:600; border-radius:6px; cursor:pointer; }
    .mode-btn.active { color:#fff; background:var(--accent); }
    main { padding:16px; }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:12px; margin:12px 0; }
    .step { font-size:10px; text-transform:uppercase; color:var(--muted); margin-right:4px; }
    .field { margin:8px 0; }
    .field label { display:block; font-size:11px; color:var(--muted); margin-bottom:4px; }
    .field input, .field select { width:100%; padding:6px 8px; background:var(--bg-sub); border:1px solid var(--border); border-radius:4px; color:var(--text); font-size:12px; }
    .btn { width:100%; padding:8px; background:var(--accent); color:var(--bg); border:none; border-radius:6px; font-size:12px; font-weight:600; cursor:pointer; margin:8px 0; }
    .btn:hover { background:#a78bfa; }
    .btn:disabled { opacity:0.5; cursor:not-allowed; }
    .dropzone { border:2px dashed var(--border); border-radius:8px; padding:20px; text-align:center; cursor:pointer; margin:12px 0; transition:all .2s; }
    .dropzone.drag { border-color:var(--accent); background:rgba(196,181,253,.08); }
    .dropzone-input { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
    .video-preview { width:180px; max-width:100%; border-radius:6px; background:#000; margin:8px 0; }
    .pos-btn { padding:4px 8px; background:transparent; border:1px solid var(--border); color:var(--muted); font-size:10px; font-weight:600; border-radius:4px; cursor:pointer; margin:2px; }
    .pos-btn.active { color:#fff; background:var(--accent); }
    .result { margin-top:12px; }
    .reel { background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:8px; margin:4px 0; text-align:center; }
    .reel video { width:100%; border-radius:4px; margin:4px -8px 8px -8px; }
    .reel small { font-size:10px; color:var(--muted); display:block; margin-top:4px; }
    .progress { background:var(--border); height:4px; border-radius:2px; overflow:hidden; margin:8px 0; }
    .bar { height:100%; background:var(--accent); width:0%; transition:width .3s; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="logo"></div>
    <div class="title">ReelSplitter</div>
    <div class="mode">
      <button class="mode-btn active" data-mode="split">Video to Parts</button>
      <button class="mode-btn" data-mode="short">AI Short</button>
    </div>
  </header>

  <main>
    <section id="splitter" class="active">
      <div class="card">
        <span class="step">1 · Upload</span>
        <h3>Select Video</h3>
        
        <div class="dropzone" id="dropzone">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
          <div>Click to upload or drag & drop video</div>
          <p class="hint">MP4, MKV, AVI, MOV, WebM • Max 2GB</p>
          <input type="file" id="videoInput" accept="video/*" class="dropzone-input" />
        </div>

        <div id="videoPreview" style="display:none; margin:12px 0;">
          <video class="video-preview" controls playsinline></video>
          <div style="font-size:11px; color:var(--muted); margin-top:4px;">
            <span id="fileName"></span> • <span id="fileDur"></span>
          </div>
        </div>

        <div class="card" style="margin-top:8px;">
          <span class="step alt">2 · Settings</span>
          <div class="field">
            <label>Font <select id="fontSelect"></select></label>
          </div>
          <div class="field" style="margin:8px 0 0 0;">
            <label>Size <input type="number" id="fontSize" value="36" min="20" max="80" style="width:60px; display:inline-block;"></label>
            <label style="margin-left:12px; color:var(--muted); font-size:11px;">Color <input type="color" id="fontColor" value="#ffffff"></label>
          </div>
          <div class="field" style="margin:8px 0 0 0;">
            <label>Position</label>
            <div style="display:flex; gap:4px; align-items:center; margin-top:4px;">
              <button class="pos-btn active" data-pos="top">Top</button>
              <button class="pos-btn" data-pos="center">Center</button>
              <button class="pos-btn" data-pos="bottom">Bottom</button>
            </div>
          </div>
        </div>

        <button class="btn" id="generateBtn">Generate Parts</button>

        <div class="progress">
          <div class="bar" id="progressBar"></div>
        </div>

        <div class="result" id="resultArea" style="margin-top:12px; display:none;">
          <span class="step alt">3 · Results</span>
          <div class="reel-grid" id="reelGrid"></div>
        </div>
      </div>
    </section>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const videoInput = document.getElementById('videoInput');
      const dropzone = document.getElementById('dropzone');
      const videoPreview = document.getElementById('videoPreview');
      const videoElement = videoPreview.querySelector('video');
      const fileName = document.getElementById('fileName');
      const fileDur = document.getElementById('fileDur');
      const generateBtn = document.getElementById('generateBtn');
      const progressBar = document.getElementById('progressBar');
      const resultArea = document.getElementById('resultArea');
      const reelGrid = document.getElementById('reelGrid');
      const fontSelect = document.getElementById('fontSelect');
      const fontSizeInput = document.getElementById('fontSize');
      const fontColorInput = document.getElementById('fontColor');

      // Load fonts from API
      async function loadFonts() {
        try {
          const res = await fetch('/api/fonts');
          if (!res.ok) throw new Error('Fonts API failed');
          const fonts = await res.json();
          fonts.forEach(family => {
            const opt = document.createElement('option');
            opt.value = family;
            opt.textContent = family;
            fontSelect.appendChild(opt);
          });
        } catch (e) {
          console.error(e);
          // Fallback fonts
          ['Poppins', 'Arial', 'Helvetica', 'sans-serif'].forEach(family => {
            const opt = document.createElement('option');
            opt.value = family;
            opt.textContent = family;
            fontSelect.appendChild(opt);
          });
        }
      }

      // Upload handling
      dropzone.addEventListener('click', () => videoInput.click());
      dropzone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropzone.classList.add('drag');
      });
      dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
      dropzone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropzone.classList.remove('drag');
        if (e.dataTransfer.files[0]) videoInput.files = e.dataTransfer.files;
      });

      videoInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const url = URL.createObjectURL(file);
        videoElement.src = url;
        videoPreview.style.display = 'block';
        fileName.textContent = file.name;
        
        const vid = videoElement;
        vid.onloadedmetadata = () => {
          const dur = Math.floor(vid.duration);
          const m = Math.floor(dur / 60);
          const s = dur % 60;
          fileDur.textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
        };
      });

      // Position selection
      document.querySelectorAll('.pos-btn').forEach(b => {
        b.addEventListener('click', () => {
          document.querySelectorAll('.pos-btn').forEach(x => x.classList.remove('active'));
          b.classList.add('active');
        });
      });

      // Generate
      generateBtn.addEventListener('click', async () => {
        const video = videoInput.files[0];
        if (!video) { alert('Upload a video first'); return; }

        generateBtn.disabled = true;
        generateBtn.textContent = 'Processing...';
        progressBar.style.display = 'block';
        reelGrid.innerHTML = '';

        const formData = new FormData();
        formData.append('video', video);
        formData.append('font', fontSelect.value || 'Poppins');
        formData.append('font_size', parseInt(fontSizeInput.value) || 36);
        formData.append('font_color', fontColorInput.value || '#ffffff');
        formData.append('pos', document.querySelector('.pos-btn.active').dataset.pos);

        try {
          const res = await fetch('/api/movie/split', { method: 'POST', body: formData });
          if (!res.ok) throw new Error('Split failed');
          const result = await res.json();
          displayResults(result);
        } catch (err) {
          console.error(err);
          alert('Error: ' + err.message);
        } finally {
          generateBtn.disabled = false;
          generateBtn.textContent = 'Generate Parts';
          progressBar.style.display = 'none';
        }
      });

      function displayResults(result) {
        reelGrid.innerHTML = '';
        result.parts.forEach((p, i) => {
          const div = document.createElement('div');
          div.className = 'reel';
          div.innerHTML = `<div style="font-size:10px; color:var(--muted); margin-bottom:4px;">${p.name}</div><video controls playsinline><source src="${p.url}" type="video/mp4"></video><small>Part ${i+1} of ${result.total}</small>`;
          reelGrid.appendChild(div);
        });
        resultArea.style.display = 'block';
        videoPreview.style.display = 'none';
      }

      // Init
      loadFonts();
    });
  </script>
</body>
</html>
